<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gemini AI Assistant</title>

  <meta
    name="description"
    content="Modern Gemini AI chatbot"
  >

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="brand-logo">
        <i class="fa-solid fa-sparkles"></i>
      </div>

      <div>
        <h2>Gemini AI</h2>
        <span>AI Assistant</span>
      </div>

    </div>

    <button class="new-chat" id="newChat">
      <i class="fa-solid fa-plus"></i>
      New Chat
    </button>

    <div class="section-title">
      Recent Chats
    </div>

    <div id="history" class="history"></div>

    <div class="sidebar-footer">

      <button id="themeBtn" class="side-button">
        <i class="fa-solid fa-moon"></i>
        <span>Dark Mode</span>
      </button>

      <button id="clearBtn" class="side-button danger">
        <i class="fa-solid fa-trash"></i>
        <span>Clear History</span>
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button id="menuBtn" class="menu-button">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="mobile-brand">
        <i class="fa-solid fa-sparkles"></i>
        Gemini AI
      </div>

      <div class="online">
        <span></span>
        Online
      </div>

    </header>


    <!-- CHAT AREA -->

    <section class="chat-area" id="chatArea">

      <div class="welcome" id="welcome">

        <div class="big-logo">
          <i class="fa-solid fa-sparkles"></i>
        </div>

        <h1>
          Karibu kwenye Gemini AI
        </h1>

        <p>
          Mimi ni AI Assistant wako.
          Uliza swali lolote na nitakusaidia.
        </p>


        <div class="suggestions">

          <button
            class="suggestion"
            data-text="Nisaidie kujifunza Python kuanzia mwanzo"
          >
            <i class="fa-solid fa-code"></i>

            <div>
              <strong>Learn Programming</strong>
              <small>Nisaidie kujifunza Python</small>
            </div>

          </button>


          <button
            class="suggestion"
            data-text="Nielezee computer kwa lugha rahisi"
          >
            <i class="fa-solid fa-computer"></i>

            <div>
              <strong>Computer</strong>
              <small>Explain computer basics</small>
            </div>

          </button>


          <button
            class="suggestion"
            data-text="Nisaidie kuandika business plan nzuri"
          >
            <i class="fa-solid fa-briefcase"></i>

            <div>
              <strong>Business</strong>
              <small>Nisaidie kupanga biashara</small>
            </div>

          </button>


          <button
            class="suggestion"
            data-text="Nipe mawazo ya website ambayo inaweza kuwa useful"
          >
            <i class="fa-solid fa-lightbulb"></i>

            <div>
              <strong>Ideas</strong>
              <small>Nipe mawazo ya website</small>
            </div>

          </button>

        </div>

      </div>


      <div id="messages"></div>

    </section>


    <!-- COMPOSER -->

    <footer class="composer">

      <div class="input-container">

        <textarea
          id="messageInput"
          placeholder="Uliza Gemini AI..."
          rows="1"
        ></textarea>

        <button
          id="sendBtn"
          class="send-button"
          title="Send"
        >
          <i class="fa-solid fa-arrow-up"></i>
        </button>

      </div>

      <p>
        Gemini AI inaweza kufanya makosa. Hakikisha taarifa muhimu.
      </p>

    </footer>

  </main>

</div>

<script src="app.js"></script>

</body>
</html>
